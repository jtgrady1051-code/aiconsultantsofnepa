<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free AI Assessment | AI Consultants of NEPA</title>
<meta name="description" content="Chat with Jamie and get a straight answer about where AI can save your business time and money. Free, about 5 minutes, no tech knowledge needed.">
<style>
  :root{
    --bg:#0b1220; --panel:#111b33; --bubble:#1a2742; --user:#2563eb;
    --text:#e8edf7; --muted:#93a1bd; --accent:#3b82f6; --border:#233252;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
  header a{color:var(--muted);text-decoration:none;font-size:14px;}
  header a:hover{color:var(--text);}
  .brand{font-weight:600;font-size:15px;margin-left:auto;}
  main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:20px 16px 32px;display:flex;flex-direction:column;}
  .intro{text-align:center;margin-bottom:18px;}
  .intro h1{font-size:24px;margin-bottom:6px;}
  .intro p{color:var(--muted);font-size:14px;}
  .chatbox{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;flex:1;}
  .chathead{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--border);}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;color:#fff;}
  .chathead .who{font-size:14px;font-weight:600;}
  .chathead .sub{font-size:12px;color:var(--muted);}
  .dot{width:8px;height:8px;border-radius:50%;background:#34d399;margin-left:auto;}
  #msgs{display:flex;flex-direction:column;gap:10px;padding:16px 0;flex:1;min-height:320px;}
  .jamie,.user{padding:11px 14px;border-radius:14px;font-size:15px;line-height:1.5;max-width:86%;white-space:pre-wrap;word-wrap:break-word;}
  .jamie{background:var(--bubble);border-top-left-radius:4px;align-self:flex-start;}
  .user{background:var(--user);color:#fff;border-top-right-radius:4px;align-self:flex-end;}
  #chips{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:10px;}
  #chips button{background:transparent;border:1px solid var(--accent);color:var(--text);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;}
  #chips button:hover{background:var(--accent);}
  .inrow{display:flex;gap:8px;}
  #inp{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:11px 14px;font-size:15px;outline:none;}
  #inp:focus{border-color:var(--accent);}
  #sendbtn{background:var(--accent);border:none;border-radius:10px;color:#fff;padding:0 18px;font-size:15px;font-weight:600;cursor:pointer;}
  #sendbtn:disabled,#inp:disabled{opacity:.5;cursor:default;}
  .typing{display:flex;gap:5px;align-items:center;background:var(--bubble);border-radius:14px;border-top-left-radius:4px;padding:14px;align-self:flex-start;}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
  .card{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:18px;align-self:stretch;}
  .card .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
  .score{font-size:34px;font-weight:700;}
  .score small{font-size:13px;color:var(--muted);font-weight:400;}
  .pills{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px;}
  .pills span{font-size:12px;background:var(--bubble);border:1px solid var(--border);padding:5px 11px;border-radius:999px;}
  .book{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;font-size:15px;padding:12px 20px;border-radius:10px;}
  .fine{font-size:12px;color:var(--muted);margin-top:10px;}
  .errrow{align-self:flex-start;}
  .errrow button{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:16px;}
</style>
</head>
<body>
<header>
  <a href="https://aiconsultantsofnepa.com/">&larr; Back to site</a>
  <span class="brand">AI Consultants of NEPA</span>
</header>
<main>
  <div class="intro">
    <h1>Find out what AI can do for your business</h1>
    <p>Chat with Jamie. About 5 minutes, no commitment, no tech knowledge needed.</p>
  </div>
  <div class="chatbox">
    <div class="chathead">
      <div class="avatar">J</div>
      <div>
        <div class="who">Jamie</div>
        <div class="sub">AI assistant, answers in real time</div>
      </div>
      <div class="dot" title="Online"></div>
    </div>
    <div id="msgs"></div>
    <div id="chips"></div>
    <div class="inrow">
      <input id="inp" type="text" maxlength="2000" placeholder="Type your answer..." autocomplete="off" disabled>
      <button id="sendbtn" disabled>Send</button>
    </div>
  </div>
</main>
<footer>This chat runs on the same AI we build for our clients. &copy; 2026 AI Consultants of NEPA</footer>
<script>
(function(){
  var msgs=document.getElementById('msgs'),chipsEl=document.getElementById('chips'),
      inp=document.getElementById('inp'),sendBtn=document.getElementById('sendbtn');
  var history=[];
  var CALENDLY='https://calendly.com/jtgrady1051';
  // TRANSITION NOTE: while this site is served by GitHub Pages, the backend
  // lives in the jamie-intake Vercel project, so we call it by full address.
  // After the domain moves to Vercel (which hosts /api in this same repo),
  // change this to '/api/assess' for a same-origin call and retire the
  // jamie-intake project.
  var API_BASE='https://jamie-intake.vercel.app/api/assess';

  function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML;}
  function scrollDown(){var el=msgs.lastElementChild;if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});}
  function bubble(cls,html){var b=document.createElement('div');b.className=cls;b.innerHTML=html;msgs.appendChild(b);scrollDown();return b;}
  function setInput(on){inp.disabled=!on;sendBtn.disabled=!on;if(on)inp.focus();}
  function showTyping(){var t=document.createElement('div');t.className='typing';t.innerHTML='<span></span><span></span><span></span>';msgs.appendChild(t);scrollDown();return t;}

  function renderText(t){
    var h=esc(t);
    h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    return h;
  }

  function parseReply(raw){
    var out={text:raw,chips:null,complete:null};
    var ac=raw.match(/ASSESSMENT_COMPLETE:\s*(\{[\s\S]*\})/);
    if(ac){try{out.complete=JSON.parse(ac[1]);}catch(e){} out.text=out.text.replace(ac[0],'');}
    var qr=out.text.match(/QUICK_REPLIES:\s*(\[[^\]]*\])/);
    if(qr){try{out.chips=JSON.parse(qr[1]);}catch(e){} out.text=out.text.replace(qr[0],'');}
    out.text=out.text.trim();
    return out;
  }

  function showChips(list){
    chipsEl.innerHTML='';
    list.forEach(function(c){
      var b=document.createElement('button');b.textContent=c;
      b.onclick=function(){chipsEl.innerHTML='';send(c);};
      chipsEl.appendChild(b);
    });
  }

  function showResults(d){
    var card=document.createElement('div');card.className='card';
    var score=Math.max(0,Math.min(100,Math.round(d.readiness_score||0)));
    var svcs=(d.recommended_services||[]).slice(0,3);
    var inner='<div class="label">Your AI readiness</div>'+
      '<div class="score">'+score+' <small>out of 100</small></div>';
    if(svcs.length){inner+='<div class="label" style="margin-top:12px">Where we\'d start</div><div class="pills">'+
      svcs.map(function(s){return '<span>'+esc(s)+'</span>';}).join('')+'</div>';}
    if(d.qualified){
      inner+='<a class="book" href="'+CALENDLY+'">Book your free 10-minute call</a>'+
        '<div class="fine">Free call. No commitment. No tech knowledge needed.</div>';
    }else{
      inner+='<div class="fine">No pressure. If the timing changes, we\'re right here.</div>';
    }
    card.innerHTML=inner;msgs.appendChild(card);scrollDown();
    setInput(false);inp.placeholder='Assessment complete';
  }

  function showError(){
    var row=document.createElement('div');row.className='errrow';
    var b=document.createElement('button');b.textContent='Connection hiccup. Tap to retry';
    b.onclick=function(){row.remove();callApi();};
    row.appendChild(b);msgs.appendChild(row);scrollDown();
  }

  function callApi(){
    setInput(false);
    var t=showTyping();
    fetch(API_BASE,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:history})
    }).then(function(r){
      if(!r.ok)throw new Error('bad status');
      return r.json();
    }).then(function(data){
      t.remove();
      var reply=data.reply||'';
      history.push({role:'assistant',content:reply});
      var p=parseReply(reply);
      if(p.text)bubble('jamie',renderText(p.text));
      if(p.complete){showResults(p.complete);return;}
      if(p.chips&&p.chips.length){showChips(p.chips);setInput(true);}
      else{setInput(true);}
      if(history.length>54){
        bubble('jamie','We\'ve covered a lot. Easiest next step is grabbing a free 10-minute call.');
        showResults({qualified:true,readiness_score:70,recommended_services:[]});
      }
    }).catch(function(){
      t.remove();setInput(true);showError();
    });
  }

  function send(text){
    var v=(text||'').trim();
    if(!v)return;
    bubble('user',renderText(v));
    history.push({role:'user',content:v});
    inp.value='';
    callApi();
  }

  sendBtn.onclick=function(){send(inp.value);};
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')send(inp.value);});

  history.push({role:'user',content:'Hi'});
  callApi();
})();
</script>
</body>
</html>
